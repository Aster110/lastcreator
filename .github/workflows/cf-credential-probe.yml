name: Cloudflare credential probe
on:
  workflow_dispatch:
permissions:
  contents: read
  id-token: write
concurrency:
  group: cloudflare-credential-probe
  cancel-in-progress: false
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Authenticate trusted CI to GCP
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093
        with:
          project_id: asterapi-staging
          workload_identity_provider: projects/901962495335/locations/global/workloadIdentityPools/github-cf-ci/providers/github-main
          audience: https://iam.googleapis.com/projects/901962495335/locations/global/workloadIdentityPools/github-cf-ci/providers/github-main
          create_credentials_file: true
          cleanup_credentials: true
      - name: Set up GCP CLI
        uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db
        with:
          project_id: asterapi-staging
      - name: Read private credential and verify harmless APIs
        run: |
          python3 - <<'PYPROBE'
          import os,json,urllib.request,urllib.error,subprocess,sys
          credential=subprocess.run(['gcloud','secrets','versions','access','latest','--secret=cloudflare-workers-ci-api-token','--project=asterapi-staging'],capture_output=True,text=True)
          expected_denial=os.environ.get('GITHUB_REF')!='refs/heads/main'
          if credential.returncode:
              condition_denied='attribute condition' in credential.stderr.lower()
              print(json.dumps({'probe':'gcp','exit':credential.returncode,'expected_denial':expected_denial,'attribute_condition_denied':condition_denied}))
              raise SystemExit(0 if expected_denial and condition_denied else 1)
          if expected_denial:
              print(json.dumps({'probe':'gcp','unexpected_grant':True}));raise SystemExit(1)
          token=credential.stdout.strip()
          if not token:raise SystemExit('empty private credential')
          account='fda898822e6dbe869cffe96e7f87c0eb'
          paths={'verify':'/accounts/'+account+'/tokens/verify','workers':'/accounts/'+account+'/workers/scripts','d1':'/accounts/'+account+'/d1/database?per_page=1','r2':'/accounts/'+account+'/r2/buckets?per_page=1'}
          for label,path in paths.items():
              request=urllib.request.Request('https://api.cloudflare.com/client/v4'+path,headers={'Authorization':'Bearer '+token,'User-Agent':'rotation-credential-probe/1'})
              try:
                  with urllib.request.urlopen(request,timeout=30) as response: status=response.status; result=json.load(response)
              except urllib.error.HTTPError as error: status=error.code; result={}
              passed=status==200 and result.get('success') is True
              if label=='verify':passed=passed and result.get('result',{}).get('status')=='active'
              print(json.dumps({'probe':label,'http':status,'passed':passed}))
              if not passed:raise SystemExit('credential read probe failed')
          PYPROBE
