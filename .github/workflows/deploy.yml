name: Deploy to Cloudflare Workers

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm ci
      - run: npm install wrangler@latest
      - name: Authenticate trusted CI to GCP
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093
        with:
          project_id: asterapi-staging
          workload_identity_provider: projects/901962495335/locations/global/workloadIdentityPools/github-cf-ci/providers/github-main
          audience: https://iam.googleapis.com/projects/901962495335/locations/global/workloadIdentityPools/github-cf-ci/providers/github-main
          create_credentials_file: true
          cleanup_credentials: true
      - name: Set up GCP CLI
        uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db
        with:
          project_id: asterapi-staging
      - run: |
          . "$GITHUB_WORKSPACE/.github/scripts/cf-env.sh"
          npm run deploy
      - name: Set secrets
        run: |
          . "$GITHUB_WORKSPACE/.github/scripts/cf-env.sh"
          echo "${{ secrets.ZZZ_ACCESS_TOKEN }}" | npx wrangler secret put ZZZ_ACCESS_TOKEN
          echo "${{ secrets.OPENROUTER_API_KEY }}" | npx wrangler secret put OPENROUTER_API_KEY
